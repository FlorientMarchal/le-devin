<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Devin</title>
<meta name="description" content="Pense à un personnage, un animal, un objet ou un aliment : le Devin le trouve en quelques questions.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout : observatoire de nuit — le Devin (une orbe vivante) au centre, son carnet de pistes en marge, un ciel qui réagit au curseur */
:root {
  --ink: #0b1517;
  --ink-2: #122226;
  --ink-3: #1d3338;
  --parchment: #f0e7d4;
  --mist: #9fb4ae;
  --brass: #e0b25c;
  --brass-deep: #b98a3a;
  --rose: #e88a72;
  --sage: #93cfa9;
  --f-display: "Young Serif", Georgia, "Times New Roman", serif;
  --f-body: "Figtree", -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 16px;
  color-scheme: dark;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--ink);
  color: var(--parchment);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  overflow-x: hidden;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }

#sky, #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#sky { z-index: 0; }
#fx { z-index: 50; }

.app {
  position: relative; z-index: 1;
  max-width: 1120px; margin: 0 auto; min-height: 100vh;
  display: grid; grid-template-rows: auto 1fr auto; gap: 8px;
  padding-block: 18px 22px;
}
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
button.brand { background: none; border: 0; padding: 0; text-align: left; }
.brand { font-family: var(--f-display); font-size: 1.55rem; display: flex; align-items: baseline; gap: 10px; }
.brand small { font-family: var(--f-mono); font-size: .68rem; color: var(--mist); letter-spacing: .14em; text-transform: uppercase; }
.top-right { display: flex; align-items: center; gap: 14px; }
.stats { font-family: var(--f-mono); font-size: .75rem; color: var(--mist); font-variant-numeric: tabular-nums; }
.pill {
  font-family: var(--f-mono); font-size: .72rem; color: var(--mist);
  background: var(--ink-2); border: 1px solid var(--ink-3); border-radius: 999px; padding: 6px 12px;
}
.pill:hover { color: var(--parchment); border-color: var(--brass-deep); }

.stage { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; align-items: start; padding-top: 6px; }

.scene { display: flex; flex-direction: column; align-items: center; gap: 14px; min-width: 0; }
.orb-wrap { position: relative; width: min(320px, 72vw); aspect-ratio: 1; max-width: 100%; touch-action: manipulation; }
.stage.solo .orb-wrap { width: min(360px, 78vw); }
/* Téléphone : un Devin plus petit pour que la question reste visible sans défiler */
@media (max-width: 560px) {
  .app { padding-block: 10px 16px; }
  .scene { gap: 10px; }
  .orb-wrap { width: min(170px, 46vw); }
  .stage.solo .orb-wrap { width: min(210px, 56vw); }
  .bubble { font-size: .88rem; padding: 6px 12px; min-height: 2em; }
  .card { gap: 14px; }
  h2.question { min-height: 2em; }
  .brand { font-size: 1.3rem; }
  .brand small { display: none; }
  .top-right { gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .pill { white-space: nowrap; padding: 5px 10px; font-size: .66rem; }
  .stats { font-size: .66rem; white-space: nowrap; }
  .ans { padding: 10px 6px 9px; }
}
/* Écran tactile : pas de clavier, donc pas de raccourcis affichés */
@media (hover: none) {
  .ans .k, footer.foot { display: none; }
}
#orb { width: 100%; height: 100%; display: block; cursor: pointer; }

.bubble {
  position: relative; max-width: 92%;
  background: var(--ink-2); border: 1px solid var(--ink-3); border-radius: 14px;
  padding: 8px 16px; font-style: italic; color: var(--parchment); font-size: .95rem;
  margin-top: -6px; min-height: 2.4em; display: grid; place-items: center; text-align: center;
}
.bubble::before {
  content: ""; position: absolute; top: -7px; left: 50%; width: 12px; height: 12px; transform: translateX(-50%) rotate(45deg);
  background: var(--ink-2); border-left: 1px solid var(--ink-3); border-top: 1px solid var(--ink-3);
}
.bubble.pop { animation: pop .35s cubic-bezier(.2,1.4,.4,1); }
@keyframes pop { from { transform: scale(.85); opacity: .4; } to { transform: none; opacity: 1; } }

.card { width: 100%; max-width: 640px; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; }
.eyebrow { font-family: var(--f-mono); font-size: .74rem; letter-spacing: .14em; text-transform: uppercase; color: var(--brass); font-variant-numeric: tabular-nums; }
h1, h2 { font-family: var(--f-display); font-weight: 400; margin: 0; text-wrap: balance; line-height: 1.12; }
h1 { font-size: clamp(2rem, 5.4vw, 3.1rem); }
h2.question { font-size: clamp(1.45rem, 3.8vw, 2.1rem); min-height: 2.4em; display: grid; place-items: center; }
.caret { display: inline-block; width: .06em; height: .9em; background: var(--brass); margin-left: 2px; vertical-align: -.08em; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.lede { color: var(--mist); max-width: 48ch; margin: 0; }

.ticker { font-family: var(--f-display); font-size: clamp(1.2rem, 3vw, 1.5rem); color: var(--mist); min-height: 1.6em; }
.ticker b { color: var(--brass); font-weight: 400; display: inline-block; }
.ticker b.in { animation: tick .45s ease; }
@keyframes tick { from { opacity: 0; transform: translateY(10px); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }

.modes { display: inline-flex; padding: 4px; gap: 4px; border-radius: 999px; background: var(--ink-2); border: 1px solid var(--ink-3); max-width: 100%; flex-wrap: wrap; justify-content: center; }
.mode { border: 0; background: transparent; color: var(--mist); border-radius: 999px; padding: 8px 16px; font-weight: 600; font-size: .9rem; transition: background .2s, color .2s; }
.mode:hover { color: var(--parchment); }
.mode[aria-selected="true"] { background: var(--brass); color: #1b1407; }
.ask { width: 100%; max-width: 560px; display: grid; gap: 8px; text-align: left; }
.ask label, .ask .hint { font-size: .85rem; color: var(--mist); }
.ask input { width: 100%; background: var(--ink-2); border: 1px solid var(--ink-3); border-radius: 12px; color: var(--parchment); padding: 12px 14px; font: inherit; }
.ask input:focus { border-color: var(--brass); outline: none; }
.qlist { display: grid; gap: 6px; }
.qbtn { text-align: left; background: var(--ink-2); border: 1px solid var(--ink-3); border-radius: 12px; padding: 10px 14px; font-size: .95rem; transition: border-color .15s, transform .15s; }
.qbtn:hover { border-color: var(--brass); transform: translateX(3px); }
.reply { display: flex; gap: 6px 12px; align-items: baseline; justify-content: center; flex-wrap: wrap; font-size: 1.02rem; max-width: 560px; }
.reply { flex-direction: column; align-items: center; gap: 4px; }
.reply em { color: var(--mist); font-size: .9rem; }
.reply div { display: flex; gap: 6px 12px; align-items: baseline; justify-content: center; flex-wrap: wrap; }
.reply span { color: var(--mist); }
.ask .hint#understood { color: var(--brass); min-height: 1.2em; }
.reply b { font-family: var(--f-display); font-weight: 400; font-size: 1.6rem; }
.reply.pop { animation: pop .35s cubic-bezier(.2,1.4,.4,1); }
.guess-row { display: flex; gap: 8px; }
.guess-row input { flex: 1; min-width: 0; }
.universes { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 560px; }
.uni {
  background: var(--ink-2); border: 1px solid var(--ink-3); border-radius: 999px; padding: 6px 12px; font-size: .85rem;
  display: inline-flex; gap: 8px; align-items: baseline; transition: border-color .2s, transform .2s;
}
.uni:hover { border-color: var(--brass-deep); transform: translateY(-2px); }
.uni b { font-family: var(--f-mono); font-weight: 500; font-size: .75rem; color: var(--brass); }

.answers { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; width: 100%; transition: opacity .2s; }
.busy .answers { opacity: .45; pointer-events: none; }
@media (max-width: 560px) { .answers { grid-template-columns: repeat(2, minmax(0, 1fr)); } .answers .a-mid { grid-column: span 2; order: 5; } }
.ans {
  position: relative; overflow: hidden;
  background: var(--ink-2); border: 1px solid var(--ink-3); border-radius: var(--r);
  padding: 14px 8px 12px; display: flex; flex-direction: column; align-items: center; gap: 5px;
  transition: transform .18s cubic-bezier(.2,1.4,.4,1), border-color .18s, box-shadow .18s;
}
.ans:hover { transform: translateY(-3px); border-color: var(--c); box-shadow: 0 10px 30px -12px var(--c); }
.ans:active { transform: translateY(0) scale(.97); }
.ans .w { font-weight: 600; font-size: .95rem; color: var(--c); }
.ans .k { font-family: var(--f-mono); font-size: .66rem; color: var(--mist); }
.ans .glyph { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--c); display: grid; place-items: center; }
.ans .glyph i { display: block; border-radius: 50%; background: var(--c); }
.ripple { position: absolute; border-radius: 50%; background: var(--c); opacity: .35; transform: scale(0); animation: ripple .55s ease-out forwards; pointer-events: none; }
@keyframes ripple { to { transform: scale(4); opacity: 0; } }

.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.btn {
  border-radius: 999px; padding: 12px 24px; font-weight: 600; border: 1px solid var(--ink-3); background: var(--ink-2);
  transition: border-color .15s, background .15s, transform .15s, box-shadow .2s;
}
.btn:hover { border-color: var(--brass); transform: translateY(-2px); }
.btn.primary { background: var(--brass); color: #1b1407; border-color: var(--brass); box-shadow: 0 8px 30px -8px #e0b25c88; }
.btn.primary:hover { background: #ecc172; box-shadow: 0 12px 40px -8px #e0b25caa; }
.btn.big { padding: 16px 34px; font-size: 1.08rem; }
.btn.glow { animation: glow 2.4s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: 0 8px 46px -4px #e0b25ccc; } }
.btn.ghost { background: transparent; border-color: transparent; color: var(--mist); padding: 8px 12px; font-weight: 500; }
.btn.ghost:hover { color: var(--parchment); transform: none; }
.btn:disabled { opacity: .35; cursor: default; transform: none; }

/* Révélation */
.medal-wrap { perspective: 600px; }
.medal {
  width: 140px; height: 140px; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--f-display); font-size: 2.7rem; color: #1b1407;
  box-shadow: 0 0 0 6px var(--ink), 0 0 0 7px var(--brass), 0 24px 70px -10px #e0b25c66;
  animation: rise .8s cubic-bezier(.2,1.3,.3,1);
  transition: transform .15s ease-out;
  position: relative;
}
.medal::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: linear-gradient(135deg, #ffffff55, transparent 45%); }
@keyframes rise { from { transform: scale(.3) rotateY(180deg); opacity: 0; } to { transform: none; opacity: 1; } }
.guess-name { font-family: var(--f-display); font-size: clamp(2rem, 6vw, 3.2rem); line-height: 1.1; text-wrap: balance; }
.guess-desc { color: var(--mist); margin-top: -10px; }
.tag { font-family: var(--f-mono); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--brass); border: 1px solid var(--brass-deep); border-radius: 999px; padding: 3px 10px; }

/* Les Indices et L'Intrus */
.clues { list-style: none; margin: 0; padding: 0; width: 100%; max-width: 560px; display: grid; gap: 8px; text-align: left; }
.clues li { display: flex; gap: 12px; align-items: baseline; background: var(--ink-2); border: 1px solid var(--ink-3); border-radius: 12px; padding: 10px 14px; }
.clues li span { font-family: var(--f-mono); font-size: .75rem; color: var(--brass); min-width: 1.2em; }
.clues li.new { border-color: var(--brass-deep); animation: fade .4s ease; }
.cards4 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: 100%; max-width: 560px; }
.pickcard {
  background: var(--ink-2); border: 1px solid var(--ink-3); border-radius: var(--r); padding: 14px 12px;
  display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; min-width: 0;
  transition: border-color .15s, transform .15s, opacity .2s;
}
.pickcard:hover:not(:disabled) { border-color: var(--brass); transform: translateY(-2px); }
.pickcard b { font-weight: 600; }
.pickcard small { color: var(--mist); font-size: .78rem; line-height: 1.3; overflow-wrap: anywhere; }
.pickcard.odd { border-color: var(--sage); box-shadow: 0 0 0 1px var(--sage); }
.pickcard.wrong { border-color: var(--rose); box-shadow: 0 0 0 1px var(--rose); }
.pickcard.dim { opacity: .55; }
.pickcard:disabled { cursor: default; }
.mini { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-size: .8rem; color: #1b1407; }
.score-big { font-family: var(--f-display); font-size: clamp(3.5rem, 12vw, 5.5rem); line-height: 1; color: var(--brass); font-variant-numeric: tabular-nums; }
.score-big small { font-size: .35em; color: var(--mist); margin-left: .2em; }

/* Page des jeux et jeux d'arcade */
.gamecards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; width: 100%; max-width: 680px; }
@media (max-width: 560px) { .gamecards { grid-template-columns: minmax(0, 1fr); } }
.gamecard {
  background: var(--ink-2); border: 1px solid var(--ink-3); border-radius: var(--r); padding: 18px; text-align: left;
  display: flex; flex-direction: column; align-items: flex-start; gap: 8px; min-width: 0; transition: border-color .15s, transform .15s;
}
.gamecard:hover { border-color: var(--brass); transform: translateY(-3px); }
.gamecard b { font-family: var(--f-display); font-weight: 400; font-size: 1.35rem; }
.gamecard small { color: var(--mist); font-size: .88rem; line-height: 1.4; }
.gamecard em { font-style: normal; font-family: var(--f-mono); font-size: .72rem; color: var(--brass); }
.hud { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; font-family: var(--f-mono); font-size: .8rem; color: var(--mist); }
.hud b { color: var(--parchment); font-size: 1.15rem; font-weight: 500; margin-left: 6px; font-variant-numeric: tabular-nums; }
.word { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 5px; max-width: 600px; }
.word .slot { width: 1.7em; height: 2.1em; border-bottom: 3px solid var(--ink-3); display: grid; place-items: end center; font-family: var(--f-display); font-size: clamp(1.1rem, 4.2vw, 1.6rem); padding-bottom: 2px; }
.word .slot.on { border-color: var(--brass); }
.word .slot.missed { color: var(--rose); }
.word .gap { width: .9em; }
.word .sym { font-family: var(--f-display); font-size: clamp(1.1rem, 4.2vw, 1.6rem); align-self: end; }
.lives { display: flex; gap: 6px; }
.lives i { width: 12px; height: 12px; border-radius: 50%; background: var(--ink-3); }
.lives i.on { background: var(--brass); box-shadow: 0 0 8px #e0b25c88; }
.keys { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 6px; width: 100%; max-width: 520px; }
.key { background: var(--ink-2); border: 1px solid var(--ink-3); border-radius: 8px; padding: 10px 0; font-family: var(--f-mono); font-weight: 500; }
.key:hover:not(:disabled) { border-color: var(--brass); }
.key.good { background: color-mix(in srgb, var(--sage) 25%, var(--ink-2)); border-color: var(--sage); }
.key.bad { opacity: .35; }
.year-big { font-family: var(--f-display); font-size: clamp(3rem, 12vw, 5rem); line-height: 1; color: var(--brass); font-variant-numeric: tabular-nums; }
.year-range { width: 100%; max-width: 520px; accent-color: var(--brass); }
.year-scale { width: 100%; max-width: 520px; display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: .72rem; color: var(--mist); margin-top: -10px; }
.chrono { display: grid; gap: 8px; width: 100%; max-width: 520px; }
.ccard {
  display: grid; grid-template-columns: 52px minmax(0, 1fr); grid-template-rows: auto auto; column-gap: 12px; align-items: center; text-align: left;
  background: var(--ink-2); border: 1px solid var(--ink-3); border-radius: 12px; padding: 10px 14px; transition: border-color .15s;
}
.ccard .num { grid-row: span 2; font-family: var(--f-mono); font-size: 1rem; color: var(--brass); text-align: center; border-right: 1px solid var(--ink-3); align-self: stretch; display: grid; place-items: center; }
.ccard b { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.ccard small { color: var(--mist); font-size: .78rem; }
.ccard.set { border-color: var(--brass-deep); }
.ccard.right { border-color: var(--sage); }
.ccard.wrong { border-color: var(--rose); }
.ccard:disabled { cursor: default; }

/* Échecs, Sudoku, calcul */
.stage.board .orb-wrap { width: min(120px, 30vw); }
.stage.board .bubble { display: none; }
.chess-status { margin: 0; font-weight: 600; }
.chess-status.warn { color: var(--rose); }
.chessboard { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); width: min(100%, 480px); aspect-ratio: 1; max-width: 100%; border: 2px solid var(--brass-deep); border-radius: 6px; overflow: hidden; }
.sq { border: 0; padding: 0; display: grid; place-items: center; position: relative; aspect-ratio: 1; }
.sq.l { background: #d8c9a6; }
.sq.d { background: #6f8f86; }
.sq.last { box-shadow: inset 0 0 0 100px rgba(224, 178, 92, .35); }
.sq.sel { box-shadow: inset 0 0 0 3px var(--brass), inset 0 0 0 100px rgba(224, 178, 92, .35); }
.sq.dot { background-image: radial-gradient(circle, rgba(11, 21, 23, .38) 0 13%, transparent 14%); }
.sq[data-rank]::before { content: attr(data-rank); position: absolute; top: 2px; left: 3px; font: 600 .6rem var(--f-mono); color: rgba(11, 21, 23, .6); }
.sq[data-file]::after { content: attr(data-file); position: absolute; bottom: 1px; right: 3px; font: 600 .6rem var(--f-mono); color: rgba(11, 21, 23, .6); }
.captured { min-height: 1.6em; width: min(100%, 480px); display: flex; flex-wrap: wrap; align-items: center; gap: 1px; }
.captured .pc { font-size: 1.15rem; }
.captured em { font-style: normal; font-family: var(--f-mono); font-size: .75rem; color: var(--mist); margin-left: 6px; }
.sq.cap { box-shadow: inset 0 0 0 4px rgba(232, 138, 114, .8); }
.sq.chk { box-shadow: inset 0 0 0 100px rgba(232, 138, 114, .55); }
.pc { font-size: min(9vw, 46px); line-height: 1; font-family: "Segoe UI Symbol", "DejaVu Sans", "Noto Sans Symbols 2", serif; }
.pc.w { color: #fbf6ea; text-shadow: 0 0 1px #000, 0 1px 2px #000, 0 0 3px #000; }
.pc.b { color: #14110c; text-shadow: 0 0 1px #fff8; }
.level { display: inline-flex; align-items: center; gap: 8px; color: var(--mist); font-size: .85rem; }
.level select { background: var(--ink-2); color: var(--parchment); border: 1px solid var(--ink-3); border-radius: 8px; padding: 6px 8px; font: inherit; }
.sudoku { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); width: min(100%, 450px); aspect-ratio: 1; max-width: 100%; border: 2px solid var(--brass-deep); border-radius: 6px; overflow: hidden; background: var(--ink-3); gap: 1px; }
.cell { border: 0; background: var(--ink-2); font-family: var(--f-mono); font-size: min(5vw, 1.35rem); color: var(--brass); padding: 0; aspect-ratio: 1; }
.cell.given { color: var(--parchment); font-weight: 500; }
.cell.peer { background: #172a2e; }
.cell.same { background: #2a3a2c; }
.cell.sel { background: #3a3220; box-shadow: inset 0 0 0 2px var(--brass); }
.cell.err { color: var(--rose); }
.cell.br { border-right: 2px solid var(--brass-deep); }
.cell.bb { border-bottom: 2px solid var(--brass-deep); }
.pad { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; width: 100%; max-width: 450px; }
.pad .key { font-size: 1.1rem; display: flex; align-items: baseline; justify-content: center; gap: 3px; }
.pad .key small { font-size: .6rem; color: var(--mist); }
.pad .key:disabled { opacity: .3; }
.cell .notes { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; height: 100%; padding: 2px; }
.cell .notes i { font-style: normal; font-size: min(2.2vw, .62rem); color: var(--mist); display: grid; place-items: center; line-height: 1; }
#sdNotes[aria-pressed="true"] { border-color: var(--brass); color: var(--brass); }

<script>
/* ---------- Données ---------- */
function applyTags(t, tags, implique) {
  for (const tag of tags.split(" ").filter(Boolean)) {
    if (tag[0] === "~") t[tag.slice(1)] = 0.5;
    else if (tag[0] === "-") t[tag.slice(1)] = 0;
    else t[tag] = 1;
  }
  let changed = true;
  while (changed) {
    changed = false;
    for (const [k, v] of Object.entries(t)) if (v > 0) for (const imp of implique[k] || []) {
      if (!(imp in t)) { t[imp] = v; changed = true; }
    }
  }
  return t;
}
// Fiches générées depuis Wikidata (wikidata.js) : chargées à la demande, voir ensureMode
const wiki = () => (typeof WIKI !== "undefined" ? WIKI : { defaults: {}, curated: {}, entries: [], newKeys: [] });
// Traits ajoutés après coup : pour les fiches faites main, on les reprend de Wikidata quand elles y sont rapprochées
let NEW_KEYS = new Set();
const DEFAULTS = {};
function initWiki() {
  const W = wiki();
  NEW_KEYS = new Set(W.newKeys || []);
  for (const [kind, d] of Object.entries(W.defaults)) DEFAULTS[kind] = { zero: new Set(d.zero.split(" ")), soft: new Set(d.soft.split(" ")) };
}
if (typeof OEUVRES_DEFAULTS !== "undefined") DEFAULTS.o = { zero: new Set(OEUVRES_DEFAULTS.zero.split(" ")), soft: new Set(OEUVRES_DEFAULTS.soft.split(" ")) };
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const words = s => s.split(" ");

/* Enchaînement logique des questions :
   pair      — deux questions complémentaires : répondre à l'une donne la réponse à l'autre (homme / femme)
   oneOf     — une seule peut être vraie : après un « oui », on ne pose plus les autres
   needs     — question précise posée seulement après un « oui » à l'une des questions générales
   notIfNo / notIfYes — questions sans objet après un « non » / un « oui » à une autre
   chains    — seuils croissants : « né après 1990 » ⇒ « né après 1980 » ; « pas après 1970 » ⇒ « pas après 1990 »
   implies   — [question, réponse, question déduite, réponse déduite] */
const EUROPE = "anglais espagne italie allemagne russie belgique suisse paysbas portugal pologne nordique grece irlande autriche";
const SPORTS = "foot basket tennis combat voiture cyclisme athletisme natation rugby hockey golf baseball cricket footus handball";
const CLUBS = "psg om ol monaco realmadrid barca atletico manutd liverpool chelsea arsenal mancity bayern dortmund juventus milan inter";
const BIRTH = words("neapres1960 neapres1970 neapres1980 neapres1990 neapres2000");
const LOGIC_PERSONNAGE = {
  pair: [["homme", "femme"]],
  chains: [BIRTH],
  implies: [
    ["neavant1945", 1, "neapres1960", 0], ["neapres1960", 1, "neavant1945", 0], ["jeune", 1, "neapres1980", 1],
    ["neapres1990", 1, "jeune", 1], ["vivant", 0, "jeune", 0], ["reel", 0, "vivant", 0], ["passe", 1, "neapres1960", 0]
  ],
  oneOf: [
    words("gardien defenseur milieu attaquant"), words("presidentus presidentfr"),
    words("francais americain japon canada australie turquie " + EUROPE + " bresil argentine mexique chine inde coree egypte"),
    words("deurope damerique afrique asie"), words("europe francais"), words("maghreb afriquenoire egypte"), words("humain animal robot"), words("chien chat"), words(SPORTS),
    words("antiquite moyenage siecle20"), words("toi famille")
  ],
  needs: Object.assign(
    Object.fromEntries(words(EUROPE).map(k => [k, ["europe"]])),
    Object.fromEntries(words("bresil argentine mexique").map(k => [k, ["amlatine"]])),
    Object.fromEntries(words("chine inde coree").map(k => [k, ["asie"]])),
    Object.fromEntries(words(SPORTS + " retraite olympique").map(k => [k, ["sport"]])),
    Object.fromEntries(words("rap rock pop jazz classique chanteur compositeur groupe grammy").map(k => [k, ["musique"]])),
    Object.fromEntries(words("pokemon nintendo").map(k => [k, ["jeu"]])),
    Object.fromEntries(words("dragonball onepiece naruto").map(k => [k, ["anime"]])),
    Object.fromEntries(words("got doctorwho").map(k => [k, ["serie"]])),
    Object.fromEntries(words(CLUBS + " gardien defenseur milieu attaquant entraineur").map(k => [k, ["foot"]])),
    Object.fromEntries(words("filmmarvel filmhp filmstarwars filmbond doubleur").map(k => [k, ["acteur"]])),
    Object.fromEntries(words("guitare piano batterie").map(k => [k, ["musique"]])),
    {
      europe: ["deurope"], europeest: ["europe"], amlatine: ["damerique"], maghreb: ["afrique"], afriquenoire: ["afrique"], moyenorient: ["asie"],
      ski: ["sport"], volley: ["sport"], opera: ["musique"], cheforchestre: ["musique"],
      nba: ["basket"], f1: ["voiture"], presidentus: ["politique"], presidentfr: ["politique"], roifrance: ["royal"],
      egypte: ["afrique"], ballondor: ["foot"], chefetat: ["politique"], oscar: ["acteur", "realisateur", "film"],
      simpsons: ["dessin", "serie"], dc: ["marvel"], harrypotter: ["livre", "film", "pouvoir"], tolkien: ["livre", "film"],
      starwars: ["espace", "film"], startrek: ["espace", "serie"], chien: ["animal"], chat: ["animal"],
      famille: ["proche"], toi: ["proche"], jeune: ["vivant"], antiquite: ["passe"], moyenage: ["passe"]
    }
  ),
  notIfNo: Object.fromEntries(words("vivant jeune neavant1945 " + BIRTH.join(" ") + " grand mortjeune assassine nobel oscar grammy ballondor olympique chefetat retraite proche").map(k => [k, ["reel"]])),
  notIfYes: Object.assign(
    Object.fromEntries(words("anime jeu bd dessin disney marvel dc monstre mythe robot starwars harrypotter tolkien pokemon nintendo simpsons got dragonball onepiece naruto startrek doctorwho").map(k => [k, ["reel"]])),
    { siecle20: ["passe"], neapres1970: ["neavant1945"], neavant1945: ["neapres1970", "jeune"], vieux: ["jeune", "enfant"] }
  )
};
const ANIMAL_TRAITS = "mammifere oiseau poisson reptile insecte domestique ferme savane dangereux carnivore pattes4 poils motifs cornes nocturne saute";
const FOOD_TRAITS = "fruit legume boisson sucre plat dessert viande laitier cereale chaud cru noyau epluche fastfood petitdej italien francais asiatique americain";
const OBJECT_TRAITS = "electrique vehicule maison cuisine sdb ecole meuble vetement jouet instrument sportobj outil metal bois plastique verre tissu papier lumiere ecrire nettoyer poche moderne";
const LOGIC_CHOSE = {
  pair: [], chains: [], implies: [],
  oneOf: [words("animal objet plante"), words("mammifere oiseau poisson reptile insecte"), words("fruit legume boisson plat"), words("italien francais asiatique americain")],
  needs: Object.assign(
    Object.fromEntries(words(ANIMAL_TRAITS).map(k => [k, ["animal"]])),
    Object.fromEntries(words(FOOD_TRAITS).map(k => [k, ["mangeable"]])),
    Object.fromEntries(words(OBJECT_TRAITS).map(k => [k, ["objet"]])),
    {
      alcool: ["boisson"], ecran: ["electrique"], pattes8: ["animal"], feuilles: ["legume"], chou: ["legume"], soupe: ["mangeable"],
      ranger: ["objet"], transparent: ["objet"], tete: ["vetement"], jambes: ["vetement"], hiver: ["vetement"], femmes: ["vetement"], passagers: ["vehicule"], roues: ["objet"], moteur: ["objet"], rapide: ["animal", "vehicule"], eau: ["animal", "vehicule"],
      froid: ["animal", "plante"], foret: ["animal", "plante"], tropical: ["mangeable", "animal", "plante"], sousterre: ["mangeable", "animal"],
      son: ["objet", "animal"], vole: ["animal", "objet"], coupe: ["objet", "plante"], cher: ["objet", "mangeable"]
    }
  ),
  notIfNo: {},
  notIfYes: { mangeable: ["objet", "animal", "plante"], objet: ["mangeable"], animal: ["mangeable"], plante: ["mangeable"] }
};

const AFTER = words("apres1970 apres1980 apres1990 apres2000 apres2010 apres2020");
const LOGIC_OEUVRE = {
  pair: [["film", "serie"]],
  chains: [AFTER],
  implies: [],
  oneOf: [words("francais americain anglais japon coree espagne italie inde allemagne canada"),
    words("marvel dc starwars harrypotter bond tolkien pokemon"), words("netflix hbo disneyplus canalplus")],
  needs: Object.assign(
    Object.fromEntries(words("longue terminee minis netflix hbo disneyplus canalplus").map(k => [k, ["serie"]])),
    Object.fromEntries(Object.keys(REALISATEURS).map(k => [k, ["film"]])),
    { anime: ["animation"], pixar: ["animation"], ghibli: ["animation"], oscarfilm: ["oscar"], palme: ["film"], cesar: ["film"] }
  ),
  notIfNo: {},
  notIfYes: {}
};
// Chance qu'un joueur connaisse la réponse (1 par défaut) : les détails pointus passent après les questions évidentes
const hard = (keys, k) => Object.fromEntries(words(keys).map(x => [x, k]));
const KNOW_PERSONNAGE = Object.assign(
  hard("mortjeune assassine nobel grammy olympique doubleur producteur economiste avocat architecte photographe explorateur cheforchestre opera medecin journaliste maths philosophe mannequin danseur siecle20", 0.55),
  hard("grand petit entrepreneur militaire religion realisateur filmmarvel filmhp filmstarwars filmbond guitare piano batterie retraite rouge bleu vert jaune rose noir blanc", 0.65),
  hard(CLUBS + " gardien defenseur milieu attaquant entraineur", 0.7),
  hard("neavant1945 neapres1960 neapres1970 neapres1980 neapres1990 neapres2000 antiquite moyenage vieux riche lunettes barbe chauve blond roux longs chapeau ecole", 0.8),
  hard("europeest moyenorient afriquenoire maghreb " + EUROPE + " bresil argentine mexique chine inde coree egypte turquie australie canada", 0.85)
);
const KNOW_OEUVRE = Object.assign(
  hard("palme cesar oscar oscarfilm minis", 0.55),
  hard(Object.keys(REALISATEURS).join(" "), 0.55), hard(Object.keys(ACTEURS).join(" "), 0.6),
  hard("adaptlivre adaptbd adaptjeu terminee longue netflix hbo disneyplus canalplus", 0.7),
  hard("apres1970 apres1980 apres1990 apres2000 apres2010 apres2020 historique biopic ado medical", 0.85)
);
const KNOW_CHOSE = Object.assign(hard("moderne", 0.6), hard("cher nocturne tropical sousterre carnivore", 0.8));

const MODES = {
  personnage: {
    questions: QUESTIONS,
    logic: LOGIC_PERSONNAGE,
    know: KNOW_PERSONNAGE,
    universes: [
      ["reel", "Personnes réelles"], ["serie", "Séries"], ["film", "Cinéma"], ["anime", "Manga"], ["jeu", "Jeux vidéo"], ["disney", "Disney & Pixar"],
      ["marvel", "Marvel & DC"], ["livre", "Livres & contes"], ["bd", "BD"], ["mythe", "Légendes"], ["proche", "Toi & tes proches"]
    ],
    labels: [["proche", "Ton entourage"], ["reel", "Personne réelle"], ["marvel", "Comics"], ["disney", "Disney"], ["anime", "Manga"], ["jeu", "Jeu vidéo"], ["bd", "BD"], ["serie", "Série"], ["film", "Cinéma"], ["livre", "Livre"], ["dessin", "Dessin animé"], ["mythe", "Légende"]],
    items() {
      const list = PERSONNAGES.map(s => this.parse(s));
      for (const [name, desc, sl, kind, tags] of wiki().entries) {
        list.push({ name, desc: cap(desc) || (kind === "h" ? "Personnalité" : "Personnage de fiction"), t: applyTags({}, tags, IMPLIQUE), sl, kind });
      }
      return list;
    },
    parse(s, custom) {
      const [name, desc, tags = ""] = s.split("|");
      const t = applyTags({}, tags, IMPLIQUE);
      const extra = wiki().curated[name];
      if (extra) {
        const w = applyTags({}, extra[1], IMPLIQUE);
        for (const k of NEW_KEYS) if (!(k in t) && w[k]) t[k] = w[k];
      }
      return { name, desc, t, custom: !!custom, sl: extra ? extra[0] : t.proche ? 120 : 40 };
    }
  },
  oeuvre: {
    questions: OEUVRES_QUESTIONS,
    logic: LOGIC_OEUVRE,
    know: KNOW_OEUVRE,
    universes: [
      ["film", "Films"], ["serie", "Séries"], ["animation", "Animation"], ["anime", "Anime"], ["superheros", "Super-héros"],
      ["comedie", "Comédies"], ["horreur", "Horreur"], ["sf", "Science-fiction"], ["francais", "Français"]
    ],
    labels: [["anime", "Anime"], ["animation", "Animation"], ["serie", "Série"], ["film", "Film"]],
    items() {
      return (typeof OEUVRES_DATA !== "undefined" ? OEUVRES_DATA : []).map(([name, desc, sl, tags, hot = 0, year = 0]) =>
        ({ name, desc: cap(desc) || "Film ou série", t: applyTags({}, tags, OEUVRES_IMPLIQUE), sl, kind: "o", hot, year }));
    },
    parse(s, custom) {
      const [name, desc, tags = ""] = s.split("|");
      return { name, desc, t: applyTags({}, tags, OEUVRES_IMPLIQUE), custom: !!custom, sl: 40 };
    }
  },
  chose: {
    questions: CHOSES_QUESTIONS,
    logic: LOGIC_CHOSE,
    know: KNOW_CHOSE,
    universes: [
      ["animal", "Animaux"], ["fruit", "Fruits"], ["legume", "Légumes"], ["plat", "Plats"], ["dessert", "Desserts"], ["boisson", "Boissons"],
      ["plante", "Plantes"], ["objet", "Objets"], ["vehicule", "Transports"], ["electrique", "Électronique"]
    ],
    labels: [["vehicule", "Transport"], ["animal", "Animal"], ["fruit", "Fruit"], ["legume", "Légume"], ["boisson", "Boisson"], ["dessert", "Douceur"], ["plat", "Plat"], ["mangeable", "Aliment"], ["plante", "Plante"], ["electrique", "Électronique"], ["vetement", "Vêtement"], ["jouet", "Jeu"], ["instrument", "Musique"], ["objet", "Objet"]],
    items() { return CHOSES.map(s => this.parse(s)); },
    parse(s, custom) {
      const [name, desc, tags = ""] = s.split("|");
      const t = applyTags({}, tags, CHOSES_IMPLIQUE);
      // pour les choses, on n'a pas de notoriété : les plus courantes (fruits, animaux familiers…) passent avant
      return { name, desc, t, custom: !!custom, sl: t.domestique || t.ferme || t.fruit || t.legume || t.maison ? 60 : 40 };
    }
  }
};

/* ---------- Mémoire locale ---------- */
const KEY = "le-devin.v1";
function loadMem() {
  try { const m = JSON.parse(localStorage.getItem(KEY)); if (m && m.obs) return m; } catch (e) {}
  return { obs: {}, plays: {}, custom: {}, games: 0, wins: 0, sound: true };
}
function saveMem() { try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) {} }
const mem = loadMem();
if (mem.sound === undefined) mem.sound = true;
if (!mem.chose) mem.chose = { obs: {}, plays: {}, custom: {} };
// ce que le Devin a appris, rangé par mode (les personnages restent à la racine pour garder les anciennes parties)
if (!mem.oeuvre) mem.oeuvre = { obs: {}, plays: {}, custom: {} };
const learned = () => (mode === "personnage" ? mem : mem[mode]);

/* ---------- Moteur bayésien ---------- */
let EPS = 0.05;
const FAMOUS_BOOST = 0.4;
const SOFT = 0.12;    // trait que Wikidata aurait probablement mentionné s'il était vrai
let mode = ["chose", "oeuvre"].includes(mem.mode) ? mem.mode : "personnage";
let MODE, QS, KEYS, A, CHARS, BY_NAME, M, PRIOR;
const built = {};

function useMode(m) {
  mode = m; MODE = MODES[m];
  if (!built[m]) {
    const keys = Object.keys(MODE.questions);
    const chars = MODE.items();
    const byName = new Map(chars.map((c, i) => [c.name, i]));
    built[m] = { keys, chars, byName, M: null, PRIOR: null };
    ({ keys: KEYS, chars: CHARS, byName: BY_NAME } = built[m]);
    QS = MODE.questions; A = KEYS.length; M = null;
    for (const [name, desc] of Object.entries(learned().custom)) {
      if (!BY_NAME.has(name)) { BY_NAME.set(name, CHARS.length); CHARS.push(MODE.parse(`${name}|${desc}|`, true)); }
    }
    buildMatrix();
    built[m].M = M; built[m].PRIOR = PRIOR;
  }
  ({ keys: KEYS, chars: CHARS, byName: BY_NAME, M, PRIOR } = built[m]);
  QS = MODE.questions; A = KEYS.length;
}

function value(c, a) {
  let base;
  if (a in c.t) base = c.t[a];
  else if (c.kind) { const d = DEFAULTS[c.kind]; base = d && d.zero.has(a) ? 0 : d && d.soft.has(a) ? SOFT : 0.5; }
  else base = c.custom ? 0.5 : 0;
  const o = learned().obs[c.name] && learned().obs[c.name][a];
  if (!o) return base;
  const k = c.custom ? 0.5 : 4;          // poids de la fiche d'origine face aux parties jouées
  return (base * k + o[0]) / (k + o[1]);
}
// Matrice précalculée des probabilités de « oui » : N entrées × A questions
function buildMatrix(from = 0) {
  const N = CHARS.length;
  if (!M || M.length < N * A) { const old = M; M = new Float32Array(N * A); if (old) M.set(old.subarray(0, from * A)); }
  PRIOR = new Float64Array(N);
  for (let i = 0; i < N; i++) {
    const c = CHARS[i];
    // les personnages célèbres sont plus souvent choisis : a priori proportionnel à la notoriété
    // la notoriété compte, mais modérément : on doit aussi trouver les gens moins connus
    PRIOR[i] = 0.7 * Math.log(c.sl || 20) + 0.6 * Math.log1p(learned().plays[c.name] || 0)
      // petit coup de pouce aux fiches faites main, souvent pensées par les joueurs d'ici
      + (c.kind || c.custom ? 0 : c.t.proche ? 1.5 : FAMOUS_BOOST);
    if (i < from) continue;
    for (let j = 0; j < A; j++) M[i * A + j] = EPS + (1 - 2 * EPS) * value(c, KEYS[j]);
  }
  if (built[mode]) { built[mode].M = M; built[mode].PRIOR = PRIOR; }
}
function refreshChar(i) { for (let j = 0; j < A; j++) M[i * A + j] = EPS + (1 - 2 * EPS) * value(CHARS[i], KEYS[j]); }
// Chargement à la demande des gros fichiers de données (la page s'ouvre sans eux)
const VERSION = "20261111";
const DATA_FILE = { personnage: "wikidata.js", oeuvre: "oeuvres-data.js" };
const loads = {};
function loadData(file) {
  if (!loads[file]) loads[file] = new Promise((ok, ko) => {
    const el = document.createElement("script");
    el.src = `${file}?v=${VERSION}`;
    el.onload = ok;
    el.onerror = () => { delete loads[file]; ko(new Error(`${file} introuvable`)); };
    document.head.appendChild(el);
  }).then(() => { if (file === DATA_FILE.personnage) initWiki(); });
  return loads[file];
}
// Prépare un thème : charge ses fiches si besoin (avec un mot d'attente), puis construit sa matrice
async function ensureMode(m, quiet = false) {
  const waiting = !quiet && !built[m] && DATA_FILE[m];
  if (waiting) { say("Je consulte mes fiches…"); document.body.classList.add("loading"); }
  try {
    if (DATA_FILE[m]) await loadData(DATA_FILE[m]);
  } catch (e) {
    say("Impossible de charger mes fiches. Vérifie ta connexion et réessaie.");
    throw e;
  } finally {
    document.body.classList.remove("loading");
  }
  useMode(m);
}

// toutes les réponses connues, y compris celles déduites (« homme » ⇒ pas « femme »)
function known() {
  const out = new Map();
  for (const a of game.answers) { out.set(a.attr, a.w); for (const d of a.inferred || []) out.set(d.attr, d.w); }
  return out;
}
function inferFrom(attr, w) {
  const L = MODE.logic, found = new Map(), todo = [[attr, w]];
  const add = (a, v) => { if (a !== attr && !found.has(a)) { found.set(a, v); todo.push([a, v]); } };
  while (todo.length) {
    const [a, v] = todo.pop();
    const yes = v >= 0.75, no = v <= 0.25;
    if (!yes && !no) continue;
    for (const [x, y] of L.pair) { if (a === x) add(y, 1 - v); if (a === y) add(x, 1 - v); }
    for (const chain of L.chains) {
      const i = chain.indexOf(a);
      if (i < 0) continue;
      if (yes) chain.slice(0, i).forEach(k => add(k, v));
      else chain.slice(i + 1).forEach(k => add(k, v));
    }
    for (const [x, xv, y, yv] of L.implies) if (a === x && (xv === 1 ? yes : no)) add(y, yv);
  }
  return [...found].map(([a, v]) => ({ attr: a, w: v }));
}
function allowed(a, k) {
  if (k.has(a)) return false;
  const L = MODE.logic;
  const yes = x => k.has(x) && k.get(x) >= 0.75, no = x => k.has(x) && k.get(x) <= 0.25;
  if (L.needs[a] && !L.needs[a].some(yes)) return false;
  if (L.notIfNo[a] && L.notIfNo[a].some(no)) return false;
  if (L.notIfYes[a] && L.notIfYes[a].some(yes)) return false;
  for (const g of L.oneOf) if (g.includes(a) && g.some(x => x !== a && yes(x))) return false;
  return true;
}

function posterior() {
  const N = CHARS.length, logs = new Float64Array(N);
  // réponses (et leurs déductions : « homme » ⇒ pas « femme »…)
  const binary = new Map();
  for (const a of game.answers) {
    binary.set(a.attr, a.w);
    for (const d of a.inferred || []) if (!binary.has(d.attr)) binary.set(d.attr, d.w);
  }
  const ans = [...binary].map(([attr, w]) => [KEYS.indexOf(attr), w]).filter(([j]) => j >= 0);
  let m = -Infinity;
  for (let i = 0; i < N; i++) {
    if (game.rejected.has(CHARS[i].name)) { logs[i] = -Infinity; continue; }
    let l = PRIOR[i];
    const row = i * A;
    for (const [j, w] of ans) { const p = M[row + j]; l += Math.log(w * p + (1 - w) * (1 - p)); }
    logs[i] = l;
    if (l > m) m = l;
  }
  let s = 0;
  for (let i = 0; i < N; i++) { logs[i] = Math.exp(logs[i] - m); s += logs[i]; }
  for (let i = 0; i < N; i++) logs[i] /= s || 1;
  return logs;
}
function ranked(post, limit) {
  const idx = [];
  for (let i = 0; i < post.length; i++) if (post[i] > 1e-9) idx.push(i);
  idx.sort((a, b) => post[b] - post[a]);
  return limit ? idx.slice(0, limit) : idx;
}

/* Choix de la question. Réglages comparés en simulation :
   CRITERION — "entropy" (réduire l'incertitude moyenne) ou "gini" (départager d'abord les favoris)
   LIVE_MASS — part de la probabilité sur laquelle on raisonne (les candidats les plus probables)
   USE_KNOW  — pondérer par la chance que le joueur connaisse la réponse (MODE.know) */
// Retenu après comparaison en simulation (les autres variantes ne faisaient pas mieux) : entropie + pertinence
let CRITERION = "entropy", LIVE_MASS = 0.999, USE_KNOW = true;
const knowOf = a => (USE_KNOW && MODE.know && MODE.know[a]) || 1;

function pickQuestion(post) {
  // on commence comme tout le monde : réel ou inventé ?
  if (!game.answers.length && mode === "personnage") return "reel";
  const scored = scoreQuestions(post);
  if (!scored.length) return null;
  // De la variété : on tire parmi les questions presque aussi utiles que la meilleure
  const slack = game.answers.length === 0 ? 0.85 : 0.97;
  const best = scored[0].gain;
  const pool = scored.filter(s => s.gain >= best - Math.abs(best) * (1 - slack)).slice(0, 3);
  return pool[Math.floor(Math.random() * pool.length)].a;
}
// Questions permises, de la plus utile à la moins utile (gain d'information attendu)
function scoreQuestions(post) {
  const k = known();
  // on ne raisonne que sur les candidats qui pèsent vraiment
  const order = ranked(post);
  const live = [];
  let mass = 0;
  for (const i of order) { live.push(i); mass += post[i]; if (mass > LIVE_MASS || live.length >= 4000) break; }
  const q = live.map(i => post[i] / mass);
  let H0 = 0, G0 = 0;
  for (const v of q) { if (v > 0) H0 -= v * Math.log(v); G0 += v * v; }
  const scored = [];
  for (let j = 0; j < A; j++) {
    const a = KEYS[j];
    if (!allowed(a, k)) continue;
    // y, n : masse de chaque candidat dans la branche « oui » / « non »
    let py = 0, sy = 0, sn = 0, qy = 0, qn = 0;
    for (let x = 0; x < live.length; x++) {
      const p = M[live[x] * A + j], y = q[x] * p, n = q[x] - y;
      py += y;
      if (y > 0) sy += y * Math.log(y);
      if (n > 0) sn += n * Math.log(n);
      qy += y * y; qn += n * n;
    }
    const pn = 1 - py;
    if (py < 0.004 || pn < 0.004) continue;
    let gain;
    if (CRITERION === "gini") gain = qy / py + qn / pn - G0;          // baisse attendue de l'indice de Gini
    else gain = H0 - (py * (Math.log(py) - sy / py) + pn * (Math.log(pn) - sn / pn));  // baisse attendue de l'entropie
    scored.push({ a, gain: gain * knowOf(a) });
  }
  return scored.sort((x, y) => y.gain - x.gain);
}

function universeOf(c) {
  const hit = MODE.labels.find(([k]) => c.t[k] === 1);
  return hit ? hit[1] : (c.custom ? "Appris de toi" : "");
}

/* ---------- Partie ---------- */
const ANSWERS = [
  { w: 1, label: "Oui", key: "1", c: "var(--sage)", g: 12 },
  { w: 0.75, label: "Plutôt oui", key: "2", c: "#b9cf93", g: 8 },
  { w: 0.5, label: "Je ne sais pas", key: "3", c: "var(--mist)", g: 4, cls: "a-mid" },
  { w: 0.25, label: "Plutôt non", key: "4", c: "#e6a77c", g: 8 },
  { w: 0, label: "Non", key: "5", c: "var(--rose)", g: 12 }
];
const MAX_Q = 60, MAX_GUESSES = 5;
let game = null, screen = "intro", current = null, guessing = null, busy = false;

function newGame() {
  game = { answers: [], rejected: new Set(), guesses: 0, nextForced: 25, top: 0 };
  sfx("start");
  next();
}

function next() {
  const post = posterior();
  const top = ranked(post, 6);
  if (!top.length || game.guesses >= MAX_GUESSES || game.answers.length >= MAX_Q) return lose();
  const topI = top[0], topP = post[topI], secondP = top[1] !== undefined ? post[top[1]] : 0;
  const n = game.answers.length;
  game.top = topP;
  orb.conf = topP;
  // proposer quand un candidat domine nettement, ou quand on a posé assez de questions
  const dominant = (topP > 0.8 || (topP > 0.6 && topP > 6 * secondP)) && n >= 6;
  if (dominant || n >= game.nextForced || top.length === 1) return guess(CHARS[topI]);
  const q = pickQuestion(post);
  if (!q) return guess(CHARS[topI]);
  current = q;
  screen = "question";
  orb.mood = topP > 0.55 ? "sure" : "idle";
  render();
}

function answer(w, fromEl) {
  if (screen !== "question" || busy) return;
  game.answers.push({ attr: current, w, inferred: inferFrom(current, w) });
  const a = ANSWERS.find(x => x.w === w);
  if (fromEl) { ripple(fromEl); fly(fromEl, a); }
  sfx("answer", w);
  thinkThenNext();
}
function thinkThenNext() {
  busy = true;
  document.getElementById("card").classList.add("busy");
  orb.mood = "think";
  say(pick(["Hmm…", "Voyons voir…", "Je consulte les étoiles…", "Intéressant…", "Laisse-moi réfléchir…"]));
  const g = game;
  setTimeout(() => { if (game !== g) return; busy = false; next(); }, reduceMotion ? 120 : 520);
}
function undo() {
  if (screen !== "question" || busy || !game.answers.length) return;
  game.answers.pop();
  sfx("undo");
  next();
}
function guess(c) {
  guessing = c; screen = "guess"; game.guesses++;
  orb.mood = "sure";
  sfx("guess");
  render();
}
function wrongGuess() {
  game.rejected.add(guessing.name);
  game.nextForced = game.answers.length + 6;
  orb.mood = "surprised"; orb.kick = 1;
  sfx("wrong");
  guessing = null;
  if (game.guesses >= MAX_GUESSES) return lose();
  const g = game;
  setTimeout(() => { if (game === g) next(); }, reduceMotion ? 0 : 450);
  say(pick(["Ah ! Vraiment ? Je continue.", "Raté… mais je n'ai pas dit mon dernier mot.", "Tu m'étonnes. Encore quelques questions."]));
}
function win() {
  learn(guessing.name);
  mem.games++; mem.wins++; saveMem();
  screen = "win"; orb.conf = 1; orb.mood = "happy";
  sfx("win");
  render();
  const m = document.querySelector(".medal");
  if (m) confetti(m);
}
function lose() { screen = "lose"; orb.conf = 0.05; orb.mood = "sad"; sfx("lose"); render(); }

function learn(name, desc) {
  if (!BY_NAME.has(name)) {
    const d = desc || "Appris grâce à toi";
    BY_NAME.set(name, CHARS.length);
    CHARS.push(MODE.parse(`${name}|${d}|`, true));
    learned().custom[name] = d;
  }
  const o = learned().obs[name] || (learned().obs[name] = {});
  for (const [attr, w] of known()) {
    if (w > 0.25 && w < 0.75 && w !== 0.5) continue;
    if (w === 0.5) continue;
    const cur = o[attr] || [0, 0];
    o[attr] = [cur[0] + w, cur[1] + 1];
  }
  learned().plays[name] = (learned().plays[name] || 0) + 1;
  const i = BY_NAME.get(name);
  if (M.length < CHARS.length * A) buildMatrix(i); else { refreshChar(i); buildMatrix(CHARS.length); }
}
function teach(name) {
  name = name.trim().replace(/\s+/g, " ");
  if (!name) return;
  const known = CHARS.find(c => norm(c.name) === norm(name));
  learn(known ? known.name : name);
  mem.games++; saveMem();
  guessing = CHARS[BY_NAME.get(known ? known.name : name)];
  screen = "taught"; orb.mood = "happy"; sfx("win");
  render();
}

/* ---------- Jeu inversé : le Devin choisit, le joueur pose les questions ---------- */
// le jeu choisi : le Devin devine, le joueur devine, Les Indices ou L'Intrus (jeux.js)
let who = ["toi", "indices", "intrus", "duel"].includes(mem.who) ? mem.who : "devin";
const GAMES = {};
const start = () => ({ toi: newReverse, indices: newIndices, intrus: newIntrus, duel: newDuel }[who] || newGame)();
// secrets possibles quand c'est le Devin qui choisit : les fiches faites main (connues de tous), ou les 400 titres les plus connus
function famousPool() {
  if (mode === "oeuvre") {
    // les 400 titres les plus connus : répandus (langues Wikipédia) et lus récemment (mois parmi les pages les plus lues)
    const fame = c => c.sl + 15 * (c.hot || 0);
    return CHARS.map((_, i) => i).filter(i => !CHARS[i].custom).sort((a, b) => fame(CHARS[b]) - fame(CHARS[a])).slice(0, 400);
  }
  return CHARS.map((_, i) => i).filter(i => i < (mode === "chose" ? CHOSES.length : PERSONNAGES.length) && !CHARS[i].t.proche);
}

function newReverse() {
  // le secret : uniquement les fiches faites main, des célébrités et personnages connus de tous
  const pool = famousPool();
  game = { reverse: true, secret: pick(pool), answers: [], rejected: new Set(), guesses: 0, top: 0, last: null };
  screen = "reverse"; orb.mood = "sure"; orb.conf = 0.04;
  sfx("start");
  render();
}
// Ce que le Devin répond, d'après sa fiche : il ne ment jamais, mais il avoue ce qu'il ignore
function reply(attr) {
  const c = CHARS[game.secret];
  const v = value(c, attr);
  const d = c.kind && DEFAULTS[c.kind];
  const sure = attr in c.t || (d ? d.zero.has(attr) : !c.custom);
  if (v >= 0.75) return { w: 1, label: "Oui", c: "var(--sage)" };
  // un trait « peu probable » (métier, pays… que Wikidata aurait cité) vaut un non ; seul l'inconnu complet reste « je ne sais pas »
  if (v <= 0.25) return { w: sure ? 0 : 0.15, label: "Non", c: "var(--rose)" };
  return sure ? { w: 0.5, label: "En partie", c: "var(--brass)" } : { w: 0.5, label: "Je ne sais pas", c: "var(--mist)" };
}
// Répond à une ou plusieurs questions connues ; « text » est la question telle que le joueur l'a tapée
function ask(attrs, text) {
  if (screen !== "reverse") return;
  attrs = [].concat(attrs).filter(Boolean);
  if (!attrs.length) return;
  const items = attrs.map(attr => {
    const prev = game.answers.find(a => a.attr === attr);
    if (prev) return { attr, label: prev.label, c: prev.c, again: true };
    const r = reply(attr);
    game.answers.push({ attr, w: r.w, label: r.label, c: r.c, inferred: [] });
    return { attr, ...r };
  });
  game.last = { text: text || "", items };
  const first = items[0];
  sfx("answer", first.label === "Oui" ? 1 : first.label === "Non" ? 0 : 0.5); orb.kick = 0.6;
  if (items.length > 1) say(items.map((it, i) => (i ? it.label.toLowerCase() : it.label)).join(" et ") + ".");
  else if (first.again) say(`Tu me l'as déjà demandé : ${first.label.toLowerCase()}.`);
  else say(first.label === "Oui" ? pick(["Oui.", "Exactement, oui.", "Eh oui !"]) : first.label === "Non" ? pick(["Non.", "Pas du tout.", "Non, raté."]) : first.label + ".");
  updateReverse(true);
}
// Les noms que le joueur peut proposer en toutes lettres dans sa question
let nameCandidates = null;
function candidates() {
  if (nameCandidates && nameCandidates.mode === mode) return nameCandidates.list;
  // le nom de famille seul (« Zidane ») ne vaut que pour les personnes, pas pour un titre ou un objet
  const famous = mode === "personnage" ? new Set(byFame().slice(0, 3000)) : new Set();
  const list = CHARS.map((c, i) => ({ name: c.name, i, famous: mode === "personnage" && (famous.has(i) || i < PERSONNAGES.length) }));
  nameCandidates = { mode, list };
  return list;
}
function freeQuestion(text) {
  text = text.trim();
  if (screen !== "reverse" || !text) return;
  const named = detectName(text, candidates());
  if (named !== null) { $("askIn").value = ""; $("understood").textContent = ""; return revGuess(CHARS[named].name); }
  const { keys, close } = understand(text, mode, QS);
  if (!keys.length) {
    say(pick(["Je n'ai pas compris ta question.", "Hmm, je ne sais pas répondre à ça.", "Pose-la autrement ?"]));
    $("understood").textContent = close.length ? "Je ne comprends pas. Tu voulais dire :" : "Je ne comprends pas. Essaie avec d'autres mots : sport, film, blond, français…";
    $("qlist").innerHTML = qButtons(close);
    bindQuestions();
    return;
  }
  $("askIn").value = ""; $("understood").textContent = ""; $("qlist").innerHTML = "";
  ask(keys, text);
}
// Aperçu en direct de ce que le Devin va comprendre
function previewQuestion() {
  const text = $("askIn").value.trim();
  $("qlist").innerHTML = "";
  if (text.length < 3) { $("understood").textContent = ""; return; }
  const named = detectName(text, candidates());
  if (named !== null) { $("understood").textContent = `Je comprends : tu proposes « ${CHARS[named].name} ».`; return; }
  const { keys } = understand(text, mode, QS);
  $("understood").textContent = keys.length ? "Je comprends : " + keys.map(k => `« ${QS[k]} »`).join(" et ") : "…";
}
function revGuess(name) {
  name = name.trim().replace(/\s+/g, " ");
  if (screen !== "reverse" || !name) return;
  const i = BY_NAME.has(name) ? BY_NAME.get(name) : CHARS.findIndex(c => norm(c.name) === norm(name));
  game.guesses++;
  if (i === game.secret) { game.found = true; return reveal(); }
  if (i >= 0) game.rejected.add(CHARS[i].name);
  orb.mood = "happy";
  setTimeout(() => { if (screen === "reverse") orb.mood = "sure"; }, 1400);
  sfx("wrong");
  say(i >= 0 ? pick([`Non, ce n'est pas ${CHARS[i].name}.`, `${CHARS[i].name} ? Raté !`, `Hé hé, pas ${CHARS[i].name}.`]) : "Je ne connais pas ce nom. Essaie encore.");
  $("guessIn").value = ""; $("guessSugg").innerHTML = "";
  updateReverse(false);
}
function reveal() {
  screen = "revealed";
  mem.revGames = (mem.revGames || 0) + 1;
  if (game.found) { mem.revWins = (mem.revWins || 0) + 1; orb.mood = "surprised"; sfx("win"); }
  else { orb.mood = "happy"; sfx("lose"); }
  saveMem();
  render();
  if (game.found) { const m = document.querySelector(".medal"); if (m) confetti(m); }
}
// nombre « effectif » de candidats encore plausibles : exp(entropie)
function remaining(post) {
  let h = 0;
  for (const p of post) if (p > 1e-12) h -= p * Math.log(p);
  return Math.max(1, Math.round(Math.exp(h)));
}
const qButtons = keys => keys.map(k => `<button class="qbtn" type="button" data-q="${k}">${esc(QS[k])}</button>`).join("");
function bindQuestions() {
  document.querySelectorAll(".qbtn").forEach(b => b.onclick = () => { $("askIn").value = ""; $("qlist").innerHTML = ""; $("understood").textContent = ""; ask(b.dataset.q); });
}
function updateReverse(fresh) {
  const post = posterior();
  const n = game.answers.length, left = remaining(post);
  $("revEyebrow").textContent = `${n} question${n > 1 ? "s" : ""} · environ ${left.toLocaleString("fr-FR")} possibilité${left > 1 ? "s" : ""}`;
  orb.conf = Math.min(0.95, 1 / Math.sqrt(left));
  const box = $("lastReply");
  if (game.last) {
    box.hidden = false;
    box.innerHTML = (game.last.text ? `<em>« ${esc(game.last.text)} »</em>` : "") +
      game.last.items.map(it => `<div><span>${esc(QS[it.attr])}</span><b style="color:${it.c}">${it.label}</b></div>`).join("");
    if (fresh) { box.classList.remove("pop"); void box.offsetWidth; box.classList.add("pop"); }
  }
  $("revSugg").innerHTML = qButtons(scoreQuestions(post).slice(0, 3).map(s => s.a));
  bindQuestions();
}

}

const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]/g, "");
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const pct = p => (p > 0 && p < 0.01 ? "<1" : Math.round(p * 100)) + " %";
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

function hueOf(name) { let h = 0; for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) % 360; return h; }
function initials(name) {
  const w = name.replace(/^(Le|La|Les|L')\s*/i, "").split(/[\s-]+/).filter(Boolean);
  return (w[0][0] + (w[1] ? w[1][0] : "")).toUpperCase();
}
const swatch = name => { const h = hueOf(name); return `radial-gradient(circle at 35% 30%, hsl(${h} 62% 80%), hsl(${(h + 30) % 360} 46% 52%) 72%)`; };
const medal = c => `<div class="medal-wrap"><div class="medal" id="medal" style="background:${swatch(c.name)}">${esc(initials(c.name))}</div></div>`;

function say(text) {
  const b = $("bubble");
  if (b.textContent === text && b.style.visibility === (text ? "" : "hidden")) return;   // même phrase : pas de rebond
  b.textContent = text;
  b.style.visibility = text ? "" : "hidden";   // pas de bulle vide quand le Devin n'a rien à dire
  b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop");
}
function remark() {
  const p = game.top, n = game.answers.length;
  if (n === 0) return pick([T().focus, "Je sens une présence. Commençons.", "Ferme les yeux et pense fort."]);
  if (p < 0.12) return pick(["Les brumes sont encore épaisses.", "Tout reste possible…", "Continue, je cherche.", "Hmm, je n'y vois pas encore clair."]);
  if (p < 0.35) return pick(["Une silhouette se dessine.", "Je commence à sentir quelque chose.", "Tiens, tiens…"]);
  if (p < 0.65) return pick(["Je chauffe…", "Plus que quelques questions.", "J'ai une petite idée."]);
  return pick(["Je le tiens presque !", "Ne me dis rien…", "Ça devient évident."]);
}

let typer = null;
function typeInto(el, text) {
  clearInterval(typer);
  if (reduceMotion) { el.textContent = text; return; }
  let i = 0;
  el.innerHTML = '<span></span><i class="caret"></i>';
  const span = el.firstChild;
  typer = setInterval(() => {
    i += 1;
    span.textContent = text.slice(0, i);
    if (i >= text.length) { clearInterval(typer); setTimeout(() => { const c = el.querySelector(".caret"); if (c) c.remove(); }, 600); }
  }, 12);
}

let fame = null;
const byFame = () => fame && fame.length === CHARS.length ? fame : (fame = CHARS.map((_, i) => i).sort((a, b) => PRIOR[b] - PRIOR[a]));
const chips = names => names.map(name => `<button class="chip" type="button" data-name="${esc(name)}">${esc(name)}</button>`).join("");
function bind() {
  const on = (id, f) => { const el = $(id); if (el) el.onclick = f; };
  on("start", start);
  on("giveup", reveal);
  on("home", goHome);
  on("undo", undo);
  on("yes", win);
  on("no", wrongGuess);
  on("again", () => {
    if (game && game.reverse) return newReverse();
    if (game && game.kind === "indices") return newIndices();
    if (game && game.kind === "intrus") return newIntrus();
    if (screen === "lose") { mem.games++; saveMem(); }
    newGame();
  });
  document.querySelectorAll(".ans").forEach(b => b.onclick = () => answer(+b.dataset.w, b));
  document.querySelectorAll(".chip").forEach(b => b.onclick = () => teach(b.dataset.name));
  document.querySelectorAll(".mode[data-who]").forEach(b => b.onclick = () => {
    if (b.dataset.who === who) return;
    who = b.dataset.who; mem.who = who; saveMem(); sfx("tick"); render();
  });
  document.querySelectorAll(".mode[data-mode]").forEach(b => b.onclick = () => {
    if (b.dataset.mode === mode) return;
    ensureMode(b.dataset.mode).then(() => { mem.mode = mode; saveMem(); fame = null; nameCandidates = null; sfx("tick"); render(); });
  });
  document.querySelectorAll(".uni").forEach(b => b.onclick = () => { tickerFilter = b.dataset.u; tickOnce(); sfx("tick"); });
  const gf = $("guessForm");
  if (gf) {
    gf.onsubmit = e => { e.preventDefault(); revGuess($("guessIn").value); };
    $("guessIn").oninput = () => {
      const q = norm($("guessIn").value);
      if (q.length < 2) { $("guessSugg").innerHTML = ""; return; }
      const hits = [];
      for (const i of byFame()) {
        if (norm(CHARS[i].name).includes(q)) { hits.push(CHARS[i].name); if (hits.length >= 6) break; }
      }
      $("guessSugg").innerHTML = chips(hits);
      $("guessSugg").querySelectorAll(".chip").forEach(b => b.onclick = () => revGuess(b.dataset.name));
    };
    $("askIn").oninput = previewQuestion;
    $("askForm").onsubmit = e => { e.preventDefault(); freeQuestion($("askIn").value); };
  }
  const f = $("teachForm");
  if (f) {
    f.onsubmit = e => { e.preventDefault(); teach($("who").value); };
    $("who").oninput = () => {
      const q = norm($("who").value);
      if (q.length < 2) return;
      const hits = [];
      for (const i of byFame()) {
        if (norm(CHARS[i].name).includes(q)) { hits.push(CHARS[i].name); if (hits.length >= 8) break; }
      }
      $("suggLabel").textContent = hits.length ? "Tu veux dire :" : "Inconnu pour moi : je l'ajouterai.";
      $("sugg").innerHTML = chips(hits);
      document.querySelectorAll(".chip").forEach(b => b.onclick = () => teach(b.dataset.name));
    };
  }
  const m = $("medal");
  if (m && !reduceMotion) {
    const wrap = m.parentElement;
    wrap.onpointermove = e => {
      const r = m.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
      m.style.transform = `rotateY(${x * 30}deg) rotateX(${-y * 30}deg)`;
    };
    wrap.onpointerleave = () => { m.style.transform = ""; };
  }
}

let tickerTimer = null, tickerFilter = null;
function tickOnce() {
  const el = $("tick");
  if (!el) return;
  const pool = tickerFilter ? CHARS.filter(c => c.t[tickerFilter] === 1) : CHARS;
  el.textContent = pick(pool).name;
  el.classList.remove("in"); void el.offsetWidth; el.classList.add("in");
}
function startTicker() { tickerFilter = null; tickOnce(); tickerTimer = setInterval(tickOnce, 1700); }

const DEVIN_SCREENS = new Set(["intro", "question", "guess", "win", "lose", "taught", "reverse", "revealed"]);

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (screen === "question") {
    const a = ANSWERS.find(a => a.key === e.key);
    if (a) answer(a.w, document.querySelector(`.ans[data-w="${a.w}"]`));
    else if (e.key === "Backspace") { e.preventDefault(); undo(); }
  } else if (screen === "guess") {
    if (e.key === "1" || e.key.toLowerCase() === "o") win();
    if (e.key === "5" || e.key.toLowerCase() === "n") wrongGuess();
  } else if (screen === "intro" && e.key === "Enter") start();
});

/* ---------- Son (synthétisé, aucun fichier) ---------- */
let ac = null;
function tone(freq, start, dur, type = "sine", gain = 0.08) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = freq;
  const t = ac.currentTime + start;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(gain, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(ac.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
function sfx(kind, w) {
  if (!mem.sound) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === "suspended") ac.resume();
    const notes = {
      start: [[392, 0], [523, .09], [659, .18]],
      tick: [[880, 0]],
      undo: [[440, 0], [330, .07]],
      guess: [[523, 0], [659, .1], [784, .2], [1047, .3]],
      wrong: [[330, 0], [262, .12]],
      win: [[523, 0], [659, .1], [784, .2], [1047, .32], [784, .44], [1047, .56]],
      lose: [[392, 0], [349, .15], [311, .3], [262, .48]]
    };
    if (kind === "answer") { tone(330 + w * 330, 0, .25, "triangle", .07); return; }
    for (const [f, s] of notes[kind]) tone(f, s, kind === "win" ? .5 : .3, "triangle", .06);
  } catch (e) {}
}

/* ---------- Le Devin : une orbe vivante ---------- */
const orbCv = $("orb"), octx = orbCv.getContext("2d");
const orb = { conf: 0.04, shown: 0.04, kick: 0, mood: "idle", look: { x: 0, y: 0 }, lookT: { x: 0, y: 0 }, blink: 0, nextBlink: 2, face: { open: 1, brow: 0, raise: 0, mouth: .3, happy: 0, o: 0 }, lastPointer: -1e9 };
const MOODS = {
  idle:      { open: 1,    brow: 0,    raise: 0,   mouth: .35, happy: 0, o: 0 },
  think:     { open: .72,  brow: .1,   raise: 1,   mouth: 0,   happy: 0, o: .5 },
  sure:      { open: .58,  brow: .35,  raise: .5,  mouth: .6,  happy: 0, o: 0 },
  happy:     { open: 1,    brow: -.2,  raise: 0,   mouth: 1,   happy: 1, o: 0 },
  sad:       { open: .62,  brow: -.6,  raise: 0,   mouth: -.7, happy: 0, o: 0 },
  surprised: { open: 1.25, brow: -.3,  raise: 0,   mouth: 0,   happy: 0, o: 1 }
};
const parts = Array.from({ length: 200 }, () => ({
  th: Math.random() * Math.PI * 2, ph: Math.acos(2 * Math.random() - 1),
  r: 0.55 + Math.random() * 0.42, sp: 0.2 + Math.random() * 0.6, sz: 0.6 + Math.random() * 1.5
}));
let pointer = { x: innerWidth / 2, y: innerHeight / 2 };
addEventListener("pointermove", e => { pointer = { x: e.clientX, y: e.clientY }; orb.lastPointer = performance.now(); });
addEventListener("pointerdown", e => { pointer = { x: e.clientX, y: e.clientY }; orb.lastPointer = performance.now(); });
orbCv.addEventListener("click", () => { orb.kick = 1; orb.blink = 1; sfx("tick"); if (screen === "intro") say(pick(["Hé ! Ça chatouille.", "Je vois déjà ton personnage… presque.", "Clique sur le bouton, pas sur moi !"])); });

const lerp = (a, b, t) => a + (b - a) * t;
function sizeCanvas(cv) {
  const r = cv.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 2);
  cv.width = Math.max(1, r.width * d); cv.height = Math.max(1, r.height * d);
}

function drawOrb(now, dt) {
  const W = orbCv.width, H = orbCv.height;
  if (W < 2) return;
  const cx = W / 2, cy = H / 2, R = W * 0.33, k = W / 320;
  orb.shown = lerp(orb.shown, orb.conf, 0.05);
  orb.kick = Math.max(0, orb.kick - dt * 1.8);
  const f = orb.face, target = MOODS[orb.mood];
  for (const key in f) f[key] = lerp(f[key], target[key], 0.12);

  // regard : suit le pointeur, erre quand on ne bouge pas, lève les yeux quand il réfléchit
  const rect = orbCv.getBoundingClientRect();
  const ocx = rect.left + rect.width / 2, ocy = rect.top + rect.height / 2;
  if (orb.mood === "think") {
    orb.lookT = { x: 0.6 * Math.cos(now / 260), y: -0.6 + 0.2 * Math.sin(now / 260) };
  } else if (now - orb.lastPointer < 4000) {
    const dx = pointer.x - ocx, dy = pointer.y - ocy, d = Math.hypot(dx, dy) || 1, m = Math.min(1, d / 260);
    orb.lookT = { x: dx / d * m, y: dy / d * m };
  } else if (Math.random() < dt * 0.6) {
    orb.lookT = { x: Math.random() * 1.6 - 0.8, y: Math.random() * 1.2 - 0.6 };
  }
  orb.look.x = lerp(orb.look.x, orb.lookT.x, 0.15);
  orb.look.y = lerp(orb.look.y, orb.lookT.y, 0.15);
  orb.nextBlink -= dt;
  if (orb.nextBlink <= 0) { orb.blink = 1; orb.nextBlink = 2 + Math.random() * 4; }
  orb.blink = Math.max(0, orb.blink - dt * 7);
  const blinkK = 1 - Math.sin(orb.blink * Math.PI);

  octx.clearRect(0, 0, W, H);
  const c = orb.shown;
  const hue = lerp(176, 40, c), sat = lerp(38, 72, c);
  const bob = reduceMotion ? 0 : Math.sin(now / 1400) * R * 0.02;

  // halo
  const halo = octx.createRadialGradient(cx, cy, R * 0.3, cx, cy, R * 1.5);
  halo.addColorStop(0, `hsla(${hue},${sat}%,60%,${0.2 + c * 0.25 + orb.kick * 0.2})`);
  halo.addColorStop(1, "hsla(0,0%,0%,0)");
  octx.fillStyle = halo; octx.fillRect(0, 0, W, H);

  // anneau de certitude
  octx.lineCap = "round";
  octx.lineWidth = 3 * k;
  octx.strokeStyle = "rgba(240,231,212,0.08)";
  octx.beginPath(); octx.arc(cx, cy, R * 1.28, 0, Math.PI * 2); octx.stroke();
  if (screen !== "intro") {
    octx.strokeStyle = `hsl(${hue},${sat + 10}%,65%)`;
    octx.beginPath(); octx.arc(cx, cy, R * 1.28, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.max(0.01, c)); octx.stroke();
  }

  const oy = cy + bob;
  const s = 1 + orb.kick * 0.05;
  // corps
  const body = octx.createRadialGradient(cx - R * 0.35, oy - R * 0.4, R * 0.05, cx, oy, R * s);
  body.addColorStop(0, `hsla(${hue},${sat}%,82%,0.6)`);
  body.addColorStop(0.5, `hsla(${hue},${sat}%,34%,0.55)`);
  body.addColorStop(1, `hsla(${hue},${sat}%,12%,0.95)`);
  octx.beginPath(); octx.arc(cx, oy, R * s, 0, Math.PI * 2); octx.fillStyle = body; octx.fill();
  octx.lineWidth = 1.5 * k; octx.strokeStyle = `hsla(${hue},${sat}%,78%,0.35)`; octx.stroke();

  // brume intérieure
  const spin = reduceMotion ? 0 : (0.15 + c * 0.5 + orb.kick * 2 + (orb.mood === "think" ? 0.8 : 0));
  octx.save();
  octx.beginPath(); octx.arc(cx, oy, R * s * 0.98, 0, Math.PI * 2); octx.clip();
  for (const p of parts) {
    p.th += dt * spin * p.sp;
    const rr = R * p.r;
    const x = Math.sin(p.ph) * Math.cos(p.th), y = Math.cos(p.ph), z = Math.sin(p.ph) * Math.sin(p.th);
    octx.fillStyle = `hsla(${hue + z * 25},${sat + 15}%,${72 + z * 14}%,${0.1 + (z + 1) * 0.22})`;
    octx.beginPath(); octx.arc(cx + x * rr, oy + y * rr, p.sz * k * (0.7 + (z + 1) * 0.4), 0, Math.PI * 2); octx.fill();
  }
  octx.restore();

  // visage
  const sep = R * 0.34, ey = oy - R * 0.08;
  const lx = orb.look.x * R * 0.07, ly = orb.look.y * R * 0.06;
  const ink = "#0b1517", glow = "#f0e7d4";
  octx.shadowColor = `hsla(${hue},80%,75%,0.9)`; octx.shadowBlur = 14 * k;
  for (const side of [-1, 1]) {
    const ex = cx + side * sep + lx * 0.5, eyy = ey + ly * 0.5;
    const rx = R * 0.13, ry = R * 0.17 * f.open * blinkK;
    if (f.happy > 0.5) {
      octx.strokeStyle = glow; octx.lineWidth = 5 * k;
      octx.beginPath(); octx.arc(ex, eyy + R * 0.04, rx, Math.PI * 1.1, Math.PI * 1.9); octx.stroke();
    } else {
      octx.fillStyle = glow;
      octx.beginPath(); octx.ellipse(ex, eyy, rx, Math.max(1.5 * k, ry), 0, 0, Math.PI * 2); octx.fill();
      if (ry > 3 * k) {
        octx.save(); octx.shadowBlur = 0;
        octx.beginPath(); octx.ellipse(ex, eyy, rx, ry, 0, 0, Math.PI * 2); octx.clip();
        octx.fillStyle = ink;
        const pr = R * 0.075 * (1 + f.o * 0.15);
        octx.beginPath(); octx.arc(ex + lx, eyy + ly, pr, 0, Math.PI * 2); octx.fill();
        octx.fillStyle = "rgba(255,255,255,.85)";
        octx.beginPath(); octx.arc(ex + lx - pr * 0.35, eyy + ly - pr * 0.4, pr * 0.3, 0, Math.PI * 2); octx.fill();
        octx.restore();
      }
    }
    // sourcils
    const by = eyy - R * 0.25 - (side === 1 ? f.raise * R * 0.07 : 0) - (f.o * R * 0.05);
    const tilt = f.brow * R * 0.07;
    octx.strokeStyle = glow; octx.lineWidth = 4 * k;
    octx.beginPath();
    octx.moveTo(ex + side * rx * 1.1, by - tilt);
    octx.lineTo(ex - side * rx * 0.9, by + tilt);
    octx.stroke();
  }
  // bouche
  const my = oy + R * 0.33, mw = R * 0.2;
  octx.strokeStyle = glow; octx.lineWidth = 4 * k;
  if (f.o > 0.4) {
    octx.beginPath(); octx.ellipse(cx + lx * 0.3, my, R * 0.05 * f.o, R * 0.07 * f.o, 0, 0, Math.PI * 2); octx.stroke();
  } else {
    const smirk = orb.mood === "sure" ? R * 0.05 : 0;
    octx.beginPath();
    octx.moveTo(cx - mw, my);
    octx.quadraticCurveTo(cx, my + f.mouth * R * 0.2, cx + mw, my - smirk);
    octx.stroke();
  }
  octx.shadowBlur = 0;
  // joues
  if (f.happy > 0.3) {
    octx.fillStyle = `rgba(232,138,114,${0.35 * f.happy})`;
    for (const side of [-1, 1]) { octx.beginPath(); octx.ellipse(cx + side * R * 0.55, my - R * 0.08, R * 0.1, R * 0.06, 0, 0, Math.PI * 2); octx.fill(); }
  }
  // reflet
  octx.beginPath(); octx.ellipse(cx - R * 0.42, oy - R * 0.5, R * 0.2, R * 0.09, -0.6, 0, Math.PI * 2);
  octx.fillStyle = "rgba(255,255,255,0.13)"; octx.fill();
}

/* ---------- Ciel étoilé ---------- */
const sky = $("sky"), sctx = sky.getContext("2d");
const stars = Array.from({ length: 170 }, () => ({ x: Math.random(), y: Math.random(), z: 0.2 + Math.random() * 0.8, tw: Math.random() * 6 }));
// le fond dégradé est dessiné une fois (à chaque redimensionnement), puis recopié ; le ciel est redessiné 20 fois par seconde
let skyBg = null, skyWait = 0;
function drawSky(now, dt) {
  skyWait -= dt;
  if (skyWait > 0) return;
  skyWait = 0.05;
  const W = sky.width, H = sky.height, d = Math.min(devicePixelRatio || 1, 2);
  if (!skyBg || skyBg.width !== W || skyBg.height !== H) {
    skyBg = document.createElement("canvas"); skyBg.width = W; skyBg.height = H;
    const bctx = skyBg.getContext("2d");
    const g = bctx.createRadialGradient(W * 0.3, 0, 0, W * 0.3, 0, Math.max(W, H));
    g.addColorStop(0, "#16292d"); g.addColorStop(0.6, "#0b1517"); g.addColorStop(1, "#091113");
    bctx.fillStyle = g; bctx.fillRect(0, 0, W, H);
  }
  sctx.drawImage(skyBg, 0, 0);
  const px = (pointer.x / innerWidth - 0.5), py = (pointer.y / innerHeight - 0.5);
  for (const s of stars) {
    const x = (s.x * W - px * 14 * s.z * d + W) % W, y = (s.y * H - py * 14 * s.z * d + H) % H;
    const a = 0.25 + 0.5 * s.z * (reduceMotion ? 1 : 0.6 + 0.4 * Math.sin(now / 700 + s.tw));
    sctx.fillStyle = `rgba(240,231,212,${a})`;
    sctx.beginPath(); sctx.arc(x, y, s.z * 1.3 * d, 0, Math.PI * 2); sctx.fill();
  }
}

/* ---------- Effets : étincelles et confettis ---------- */
const fxCv = $("fx"), fctx = fxCv.getContext("2d");
let sparks = [];
function cssColor(v) {
  const m = v.match(/var\((--[\w-]+)\)/);
  return m ? getComputedStyle(document.documentElement).getPropertyValue(m[1]).trim() : v;
}
function ripple(el) {
  const r = document.createElement("span");
  r.className = "ripple";
  const size = el.offsetWidth;
  r.style.width = r.style.height = size + "px";
  r.style.left = "0px"; r.style.top = (el.offsetHeight - size) / 2 + "px";
  el.appendChild(r);
  setTimeout(() => r.remove(), 600);
}
function fly(el, a) {
  if (reduceMotion) return;
  const b = el.getBoundingClientRect(), o = orbCv.getBoundingClientRect();
  const color = cssColor(a.c);
  for (let i = 0; i < 7; i++) {
    sparks.push({
      kind: "fly", t: -i * 0.025, x0: b.left + b.width * Math.random(), y0: b.top + b.height * Math.random(),
      x1: o.left + o.width / 2, y1: o.top + o.height / 2,
      cx: b.left + b.width / 2 + (Math.random() - 0.5) * 300, cy: Math.min(b.top, o.top) - Math.random() * 80,
      color, size: 2 + Math.random() * 2.5
    });
  }
}
function confetti(el) {
  if (reduceMotion) return;
  const r = el.getBoundingClientRect();
  const colors = ["#e0b25c", "#93cfa9", "#e88a72", "#f0e7d4", "#7fc3d6"];
  for (let i = 0; i < 70; i++) {
    const ang = Math.random() * Math.PI * 2, sp = 4 + Math.random() * 9;
    sparks.push({
      kind: "conf", x: r.left + r.width / 2, y: r.top + r.height / 2, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 5,
      rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4, life: 1.6 + Math.random(), color: pick(colors), w: 5 + Math.random() * 5
    });
  }
}
let fxDirty = false;   // le calque des effets n'est effacé que s'il contient quelque chose
function drawFx(dt) {
  const d = Math.min(devicePixelRatio || 1, 2);
  if (!sparks.length) { if (fxDirty) { fctx.clearRect(0, 0, fxCv.width, fxCv.height); fxDirty = false; } return; }
  fctx.clearRect(0, 0, fxCv.width, fxCv.height);
  fxDirty = true;
  const next = [];
  for (const p of sparks) {
    if (p.kind === "fly") {
      p.t += dt * 1.6;
      if (p.t < 0) { next.push(p); continue; }
      if (p.t >= 1) { orb.kick = Math.max(orb.kick, 0.6); continue; }
      const t = p.t * p.t * (3 - 2 * p.t), u = 1 - t;
      const x = u * u * p.x0 + 2 * u * t * p.cx + t * t * p.x1, y = u * u * p.y0 + 2 * u * t * p.cy + t * t * p.y1;
      fctx.globalAlpha = 1 - p.t * 0.4;
      fctx.fillStyle = p.color; fctx.shadowColor = p.color; fctx.shadowBlur = 10 * d;
      fctx.beginPath(); fctx.arc(x * d, y * d, p.size * d, 0, Math.PI * 2); fctx.fill();
      next.push(p);
    } else {
      p.life -= dt; if (p.life <= 0) continue;
      p.vy += 14 * dt; p.vx *= 0.99; p.x += p.vx * dt * 60; p.y += p.vy * dt * 60; p.rot += p.vr;
      fctx.globalAlpha = Math.min(1, p.life); fctx.shadowBlur = 0;
      fctx.save(); fctx.translate(p.x * d, p.y * d); fctx.rotate(p.rot);
      fctx.fillStyle = p.color; fctx.fillRect(-p.w * d / 2, -p.w * d / 4, p.w * d, p.w * d / 2);
      fctx.restore();
      next.push(p);
    }
  }
  fctx.globalAlpha = 1; fctx.shadowBlur = 0;
  sparks = next;
}

/* ---------- Boucle ---------- */
function resize() { sizeCanvas(orbCv); sizeCanvas(sky); sizeCanvas(fxCv); }
addEventListener("resize", resize);
new ResizeObserver(() => sizeCanvas(orbCv)).observe(orbCv);
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  drawSky(now, dt);
  drawOrb(now, dt);
  drawFx(dt);
  requestAnimationFrame(loop);
}
resize();
renderSound();
requestAnimationFrame(loop);
// premier affichage : la page de tous les jeux (définie dans arcade.js, chargé après ce script),
// puis les fiches se chargent en tâche de fond pour que les jeux démarrent sans attendre
addEventListener("DOMContentLoaded", () => {
  screen = "hub";
  render();
  setTimeout(() => {
    ensureMode(mode, true).catch(() => {});
    loadData(DATA_FILE.oeuvre).catch(() => {});
  }, 300);
});
</script>
